# Render.com Blueprint Configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: hr-rag-assistant
    env: docker
    plan: free
    region: frankfurt  # EU region, closest to Romania
    
    # Health check configuration
    healthCheckPath: /
    
    # Environment variables
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TRANSFORMERS_CACHE
        value: "/app/.cache"
      - key: HF_HOME
        value: "/app/.cache"
    
    # Auto-deploy on push to main
    autoDeploy: true
    
    # Build settings
    dockerfilePath: ./Dockerfile
    dockerContext: .
