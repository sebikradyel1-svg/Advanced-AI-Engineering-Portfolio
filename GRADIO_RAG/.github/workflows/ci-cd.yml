name: CI/CD Pipeline - AWS EC2

on:
  push:
    branches: [ main ]
    paths:
      - "GRADIO_RAG/**"
  pull_request:
    branches: [ main ]
    paths:
      - "GRADIO_RAG/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd GRADIO_RAG
        pip install -r requirements.txt
    
    - name: Lint with flake8
      run: |
        pip install flake8
        cd GRADIO_RAG
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Health check test
      run: |
        cd GRADIO_RAG
        python -c "import app; print('✅ App imports successfully')"
  
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: kradyelsebastian/hr-rag-aws
        tags: |
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./GRADIO_RAG
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=kradyelsebastian/hr-rag-aws:buildcache
        cache-to: type=registry,ref=kradyelsebastian/hr-rag-aws:buildcache,mode=max
    
    - name: Image digest
      run: echo "Image pushed with digest ${{ steps.meta.outputs.digest }}"

  notify:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deployment notification
      run: |
        echo "✅ Docker image built and pushed successfully!"
        echo "📦 Image: kradyelsebastian/hr-rag-aws:latest"
        echo "🚀 Manual deployment needed on AWS EC2"