# =============================================================================
# Fly.io Configuration - Universal Image Classifier
# Deploy: flyctl deploy
# =============================================================================

app = "universal-image-classifier"
primary_region = "ams"  # Amsterdam - closest to Romania

[build]
  dockerfile = "Dockerfile"

[env]
  MODEL_PATH = "/app/models/image_classifier_model.h5"
  CONFIG_PATH = "/app/models/image_classifier_config.json"
  TF_CPP_MIN_LOG_LEVEL = "2"
  STREAMLIT_SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/_stcore/health"
  timeout = "10s"

[[vm]]
  # Free tier: shared-cpu-1x with 256MB RAM
  # For TensorFlow, upgrade to at least 512MB
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512  # Minimum for TensorFlow

# Uncomment for more resources (paid tier):
# [[vm]]
#   cpu_kind = "shared"
#   cpus = 2
#   memory_mb = 1024
